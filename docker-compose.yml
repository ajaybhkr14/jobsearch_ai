services:
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: job_matcher_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always

volumes:
  pg_data: